<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password - Movielanche</title>
<style>
body{background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;display:flex;justify-content:center;padding:3rem 1rem;margin:0;}
.box{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:2rem;max-width:420px;width:100%;}
h2{margin-top:0;}
label{display:block;margin:0.8rem 0 0.3rem;font-size:0.85rem;}
input{width:100%;padding:0.6rem;background:#0f172a;border:1px solid #334155;color:#fff;border-radius:6px;box-sizing:border-box;}
button{margin-top:1rem;width:100%;padding:0.7rem;background:#7c3aed;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600;}
#msg{margin:0.8rem 0;min-height:1.2rem;font-size:0.9rem;}
a{color:#a78bfa;}
</style>
</head>
<body>
<div class="box">
<h2>Set a new password</h2>
<div id="msg"></div>
<form id="reset-form">
<label>New password (min 6 chars)</label>
<input type="password" id="pw1" required minlength="6" />
<label>Confirm password</label>
<input type="password" id="pw2" required minlength="6" />
<button type="submit">Reset Password</button>
</form>
<p><a href="/">Back to Movielanche</a></p>
</div>
<script>
(function () {
  var token = new URLSearchParams(window.location.search).get("token");
  var msg = document.getElementById("msg");
  var form = document.getElementById("reset-form");
  if (!token) { msg.textContent = "Missing reset token. Request a new link from the Log In screen."; form.style.display = "none"; return; }
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var a = document.getElementById("pw1").value;
    var b = document.getElementById("pw2").value;
    if (a !== b) { msg.textContent = "Passwords do not match."; return; }
    fetch("/api/auth/reset-password", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: token, password: a }) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        if (!x.ok || !x.d.success) { msg.textContent = (x.d.error && x.d.error.message) || "Reset failed."; return; }
        msg.textContent = x.d.message + " You can now log in.";
        form.style.display = "none";
      })
      .catch(function () { msg.textContent = "Network error. Try again."; });
  });
})();
</script>
</body>
</html>
