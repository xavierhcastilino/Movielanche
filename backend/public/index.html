<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieLanche - Movie Directory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>MovieLanche</h1>
    <p>Simple movie directory database showcase</p>
  </header>

  <main class="container">
    <!-- Status / Loading Banner -->
    <div id="status-message" class="status-message">Loading movies from database...</div>

    <!-- Movies List Grid -->
    <section id="movies-container" class="movies-grid"></section>
  </main>

  <!-- Movie Detail Modal -->
  <div id="detail-modal" class="modal hidden">
    <div class="modal-content">
      <button id="close-modal-btn" class="close-btn">&times;</button>
      <div id="modal-body">
        <!-- Dynamic detail content rendered here -->
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
